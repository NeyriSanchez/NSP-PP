name: Deploy to Surge

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Surge
        run: npm install --global surge

      - name: Desplegar a Surge
        run: surge ./ neyri-practica-surge.surge.sh
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
